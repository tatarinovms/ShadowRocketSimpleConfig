# @tatarinovms
[General]
# URL для автоматического обновления конфигурации
update-url = https://raw.githubusercontent.com/tatarinovms/ShadowRocketSimpleConfig/master/baseline.conf
# Обход системного прокси для локальных подключений
bypass-system = true
# Отключение IPv6 для избежания проблем с совместимостью
ipv6 = false
# Предпочтение IPv4 над IPv6
prefer-ipv6 = false
# Ответ на запросы приватных IP адресов
private-ip-answer = true
# Отключение прямого системного DNS
dns-direct-system = false
# Использование системного DNS как резервного
dns-fallback-system = true
# Fallback на прокси при сбое прямого DNS
dns-direct-fallback-proxy = true
# Основные DNS серверы
dns-server = https://xbox-dns.ru/dns-query,xbox-dns.ru,dns.quad9.net,https://dns.google/dns-query
# Резервный DNS сервер (системный)
fallback-dns-server = system
# Перехват DNS запросов на порт 53
hijack-dns = :53
# Исключения из прокси (Apple + российские домены)
skip-proxy = 192.168.0.0/16,localhost,*.local,captive.apple.com,*.apple.com,*.icloud.com,*.icloud-content.com,*.me.com,*.mac.com,*.mzstatic.com,*.aaplimg.com,*.cdn-apple.com,*.apple-dns.net,*.push.apple.com,*.apple.comscoreresearch.com,*.guzzoni.apple.com,*.apple-cloudkit.com,*.apple-fountain.com,*.apple-mapkit.com,*.apple.news,*.apple.co,10.77.0.0/24,10.7.0.0/24,17.0.0.0/8,63.92.224.0/19,65.199.22.0/23,139.178.128.0/18,144.178.0.0/19,144.178.36.0/22,144.178.48.0/20,192.35.50.0/24,198.183.17.0/24,205.180.175.0/24
# Маршруты, исключённые из TUN
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,239.255.255.250/32

